(function() {
var nodes = GRAPH_DATA.nodes.map(function(n) {
    return {id: n.id, name: n.l, type: n.t, community: n.c, file: n.f, group: n.c};
});
var links = GRAPH_DATA.links.map(function(l) {
    return {source: l.s, target: l.t};
}).filter(function(l) {
    return nodes.some(function(n) { return n.id === l.source; }) && nodes.some(function(n) { return n.id === l.target; });
});
var width = window.innerWidth, height = window.innerHeight;
var colors = d3.scaleOrdinal(d3.schemeSet3);
var svg = d3.select("body").append("svg")
    .attr("width",width).attr("height",height)
    .style("position","fixed").style("top",0).style("left",0);
var g = svg.append("g");
svg.call(d3.zoom().scaleExtent([0.05,5]).on("zoom",function(e){g.attr("transform",e.transform);}));
var sim = d3.forceSimulation(nodes)
    .force("link",d3.forceLink(links).id(function(d){return d.id;}).distance(60))
    .force("charge",d3.forceManyBody().strength(-80))
    .force("center",d3.forceCenter(width/2,height/2));
var link = g.append("g").selectAll("line").data(links).join("line")
    .attr("stroke","rgba(255,255,255,0.06)").attr("stroke-width",0.5);
var node = g.append("g").selectAll("g").data(nodes).join("g")
    .call(d3.drag()
        .on("start",function(e,d){if(!e.active)sim.alphaTarget(0.3).restart();d.fx=d.x;d.fy=d.y;})
        .on("drag",function(e,d){d.fx=e.x;d.fy=e.y;})
        .on("end",function(e,d){if(!e.active)sim.alphaTarget(0);d.fx=null;d.fy=null;}));

    .attr("r",function(d){return Math.max(2,Math.min(12,links.filter(function(l){return l.source.id===d.id||l.target.id===d.id;}).length*0.5+2));})
    .attr("fill",function(d){return colors(d.community);})
    .attr("stroke","rgba(255,255,255,0.2)").attr("stroke-width",0.5);
node.append("text").attr("class","node-label").attr("dx",8).attr("dy",3)
    .text(function(d){return d.name.length>20?d.name.slice(0,18)+"...":d.name;}).attr("fill","#ccc");

sim.on("tick",function(){
    link.attr("x1",function(d){return d.source.x;}).attr("y1",function(d){return d.source.y;})
        .attr("x2",function(d){return d.target.x;}).attr("y2",function(d){return d.target.y;});
    node.attr("transform",function(d){return"translate("+d.x+","+d.y+")";});
});
var coms={};nodes.forEach(function(n){coms[n.community]=(coms[n.community]||0)+1;});

sorted.forEach(function(item){legHtml+="<div class='com' style='color:"+colors(parseInt(item[0]))+"'>● 社区"+item[0]+" ("+item[1]+")</div>";});
document.getElementById("legend-content").innerHTML=legHtml;
